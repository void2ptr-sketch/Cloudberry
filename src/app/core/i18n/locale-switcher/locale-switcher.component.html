<mat-button-toggle-group
  class="ui-locale-switcher"
  [value]="currentLocale()"
  (change)="onLocaleChange($event.value)"
  i18n-aria-label="@@locale.switcherAria"
  aria-label="Язык интерфейса"
>
  @for (option of options; track option.id) {
    <mat-button-toggle
      class="ui-locale-switcher__btn"
      [value]="option.id"
      [attr.aria-label]="option.label"
      [title]="option.label"
    >
      {{ option.shortLabel }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
