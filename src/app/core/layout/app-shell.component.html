<div class="shell">
  <header class="shell__header">
    <mat-toolbar color="primary" class="shell__toolbar">
      <a class="shell__brand" [routerLink]="homeLink">
        <span class="shell__brand-name">Cloudberry</span>
        <span class="shell__tagline" i18n="@@shell.tagline">Cloud accounting for clouds</span>
      </a>
      <span class="spacer"></span>
      <app-locale-switcher />
      <a
        class="shell__profile"
        [routerLink]="profileLink"
        routerLinkActive="shell__profile--active"
      >
        <span class="shell__profile-label">{{ displayName() }}</span>
        <span class="shell__profile-hint" i18n="@@shell.profile">Профиль</span>
      </a>
    </mat-toolbar>
  </header>

  <mat-sidenav-container class="shell__body">
    <mat-sidenav mode="side" opened class="shell__sidenav">
      <mat-nav-list
        i18n-aria-label="@@shell.navAria"
        aria-label="Основная навигация"
      >
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="['/', item.path]"
            routerLinkActive="shell__nav-link--active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ item.label }}
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="shell__main">
      <main class="shell__content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <footer class="shell__footer">
    <p class="shell__footer-copy">
      © {{ year }} Cloudberry
      @if (showEnvBadge) {
        <mat-chip class="shell__env-badge">{{ envLabel }}</mat-chip>
      }
    </p>
    <p class="shell__footer-meta" i18n="@@shell.footerMeta">Cloud accounting for clouds · FinOps</p>
  </footer>
</div>
