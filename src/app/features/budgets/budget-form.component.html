<form class="budget-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3 class="budget-form__title">
    {{ isEditMode ? ('budget.form.titleEdit' | uiT) : ('budget.form.titleCreate' | uiT) }}
  </h3>

  <label class="budget-form__field">
    <span>{{ 'budget.form.name' | uiT }}</span>
    <input
      type="text"
      formControlName="name"
      [attr.placeholder]="'budget.form.namePlaceholder' | uiT"
    />
    @if (form.controls.name.touched && form.controls.name.hasError('required')) {
      <span class="budget-form__error">{{ 'budget.form.nameRequired' | uiT }}</span>
    }
    @if (form.controls.name.touched && form.controls.name.hasError('unsafeMarkup')) {
      <span class="budget-form__error">{{ 'common.unsafeInput' | uiT }}</span>
    }
  </label>

  <div class="budget-form__row">
    <label class="budget-form__field">
      <span>{{ 'budget.form.limit' | uiT }}</span>
      <input type="number" formControlName="limitAmount" min="1" step="0.01" />
      @if (form.controls.limitAmount.touched && form.controls.limitAmount.hasError('min')) {
        <span class="budget-form__error">{{ 'budget.form.limitMin' | uiT }}</span>
      }
    </label>

    <label class="budget-form__field budget-form__field--narrow">
      <span>{{ 'budget.form.currency' | uiT }}</span>
      <input type="text" formControlName="currency" maxlength="3" placeholder="USD" />
      @if (form.controls.currency.touched && form.controls.currency.hasError('pattern')) {
        <span class="budget-form__error">{{ 'budget.form.currencyInvalid' | uiT }}</span>
      }
    </label>
  </div>

  <div class="budget-form__row">
    <label class="budget-form__field">
      <span>{{ 'budget.form.periodStart' | uiT }}</span>
      <input type="date" formControlName="periodStart" />
    </label>

    <label class="budget-form__field">
      <span>{{ 'budget.form.periodEnd' | uiT }}</span>
      <input type="date" formControlName="periodEnd" />
      @if (form.controls.periodEnd.touched && form.controls.periodEnd.hasError('periodOrder')) {
        <span class="budget-form__error">{{ 'budget.form.periodOrder' | uiT }}</span>
      }
    </label>
  </div>

  <label class="budget-form__field">
    <span>{{ 'budget.form.scope' | uiT }}</span>
    <select formControlName="scopeId">
      @for (option of scopeOptions(); track option.id) {
        <option [value]="option.id">{{ option.label }}</option>
      }
    </select>
  </label>

  <p class="budget-form__hint">{{ 'budget.form.hint' | uiT }}</p>

  <div class="budget-form__actions">
    <button type="submit" class="btn btn--primary">
      {{ isEditMode ? ('common.save' | uiT) : ('common.add' | uiT) }}
    </button>
    <button type="button" class="btn btn--ghost" (click)="cancel()">{{ 'common.cancel' | uiT }}</button>
  </div>
</form>
