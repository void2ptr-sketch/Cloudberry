<form class="budget-form" [formGroup]="form" (ngSubmit)="submit()">
  @if (isEditMode) {
    <h3 class="budget-form__title" i18n="@@budget.form.titleEdit">Редактировать бюджет</h3>
  } @else {
    <h3 class="budget-form__title" i18n="@@budget.form.titleCreate">Новый бюджет</h3>
  }

  <label class="budget-form__field">
    <span i18n="@@budget.form.name">Название</span>
    <input
      type="text"
      formControlName="name"
      i18n-placeholder="@@budget.form.namePlaceholder"
      placeholder="Например, Месячный лимит организации"
    />
    @if (form.controls.name.touched && form.controls.name.hasError('required')) {
      <span class="budget-form__error" i18n="@@budget.form.nameRequired">Укажите название</span>
    }
    @if (form.controls.name.touched && form.controls.name.hasError('unsafeMarkup')) {
      <span class="budget-form__error" i18n="@@common.unsafeInput">
        Недопустимые символы или разметка в поле
      </span>
    }
  </label>

  <div class="budget-form__row">
    <label class="budget-form__field">
      <span i18n="@@budget.form.limit">Лимит</span>
      <input type="number" formControlName="limitAmount" min="1" step="0.01" />
      @if (form.controls.limitAmount.touched && form.controls.limitAmount.hasError('min')) {
        <span class="budget-form__error" i18n="@@budget.form.limitMin">Лимит должен быть больше нуля</span>
      }
    </label>

    <label class="budget-form__field budget-form__field--narrow">
      <span i18n="@@budget.form.currency">Валюта</span>
      <input type="text" formControlName="currency" maxlength="3" placeholder="USD" />
      @if (form.controls.currency.touched && form.controls.currency.hasError('pattern')) {
        <span class="budget-form__error" i18n="@@budget.form.currencyInvalid">
          Три заглавные буквы (ISO 4217)
        </span>
      }
    </label>
  </div>

  <div class="budget-form__row">
    <label class="budget-form__field">
      <span i18n="@@budget.form.periodStart">Начало периода</span>
      <input type="date" formControlName="periodStart" />
    </label>

    <label class="budget-form__field">
      <span i18n="@@budget.form.periodEnd">Конец периода</span>
      <input type="date" formControlName="periodEnd" />
      @if (form.controls.periodEnd.touched && form.controls.periodEnd.hasError('periodOrder')) {
        <span class="budget-form__error" i18n="@@budget.form.periodOrder">
          Конец периода не может быть раньше начала
        </span>
      }
    </label>
  </div>

  <label class="budget-form__field">
    <span i18n="@@budget.form.scope">Область (scope)</span>
    <select formControlName="scopeId">
      @for (option of scopeOptions(); track option.id) {
        <option [value]="option.id">{{ option.label }}</option>
      }
    </select>
  </label>

  <p class="budget-form__hint" i18n="@@budget.form.hint">
    Алерты срабатывают автоматически при достижении 80% и 100% от лимита за выбранный период.
  </p>

  <div class="budget-form__actions">
    @if (isEditMode) {
      <button type="submit" class="btn btn--primary" i18n="@@common.save">Сохранить</button>
    } @else {
      <button type="submit" class="btn btn--primary" i18n="@@common.add">Добавить</button>
    }
    <button type="button" class="btn btn--ghost" (click)="cancel()" i18n="@@common.cancel">Отмена</button>
  </div>
</form>
