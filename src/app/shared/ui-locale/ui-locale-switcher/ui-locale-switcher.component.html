<div class="ui-locale-switcher" role="group" [attr.aria-label]="'locale.switcherAria' | uiT">
  @for (option of options; track option.id) {
    <button
      type="button"
      class="ui-locale-switcher__btn"
      [class.ui-locale-switcher__btn--active]="locale() === option.id"
      [attr.aria-pressed]="locale() === option.id"
      [attr.aria-label]="option.label"
      [title]="option.label"
      (click)="selectLocale(option.id)"
    >
      {{ option.shortLabel }}
    </button>
  }
</div>
